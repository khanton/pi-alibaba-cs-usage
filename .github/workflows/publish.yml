name: Publish Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  id-token: write # Required for OIDC (npm trusted publishing)
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false # never use caching in release builds

      # Trusted publishing requires npm >= 11.5.1 and Node >= 22.14.0.
      - run: npm install -g npm@11

      - run: npm ci

      - run: npm run check

      - run: npm test

      # No npm token: the CLI detects the OIDC environment and authenticates
      # through the trusted publisher configured for this package.
      # Provenance is attached automatically.
      - run: npm publish
